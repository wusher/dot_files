onboarding = false
# Place this file at ~/.config/herdr/config.toml

[keys]
# Match tmux prefix (tmux.conf: set -g prefix C-a)
prefix = "ctrl+a"

# Settings defaults to prefix+s, which the fzf space picker below took over.
settings = "prefix+,"

# --- navigation, mirrored from tmux.conf ---

# Pane focus: tmux has prefix+hjkl, plus prefix-free alt+hjkl and alt+arrows
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]

# Tabs == tmux windows: tmux uses ctrl+alt+left/right for prev/next window.
# prefix+n is NOT next_tab here, because tmux.conf uses bind n for new-window.
previous_tab = ["prefix+p", "ctrl+alt+left"]
next_tab = "ctrl+alt+right"

# tmux bind n = new-window
new_tab = ["prefix+n", "prefix+c"]

# tmux jumps windows with alt+1..9 (no prefix)
switch_tab = ["prefix+1..9", "alt+1..9"]

# Spaces (workspaces): built-in picker. prefix+s is taken by the fzf picker
# in [[keys.command]] below, so the built-in one keeps prefix+w only.
workspace_picker = "prefix+w"

# Inside navigate mode, j/k walk spaces (arrows still work)
navigate_workspace_down = ["down", "j"]
navigate_workspace_up = ["up", "k"]

# j/k now belong to spaces, so panes move with ctrl+j/ctrl+k in navigate mode.
# h/l are untouched and still move panes left/right.
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"

# Splits, matching tmux.conf (bind r = split right, bind d = split down)
split_vertical = ["prefix+r", "prefix+v"]
split_horizontal = ["prefix+d", "prefix+minus"]

# prefix+r used to be resize mode. Moved to shift+R, same as tmux.conf bind R.
resize_mode = "prefix+shift+r"

# Jump spaces directly, no picker
next_workspace = "prefix+ctrl+j"
previous_workspace = "prefix+ctrl+k"
switch_workspace = "prefix+alt+1..9"

# prefix+alt+1..9 was jump-to-agent by default. Moved to shift so the
# space numbers can have it.
focus_agent = "prefix+shift+1..9"

# fzf space picker, like tmux prefix+s session picker.
# Script lives in this repo at herdr/plugins/space-picker.rb.
[[keys.command]]
key = "prefix+s"
type = "popup"
command = "/Users/wusher/mine/dot_files/herdr/plugins/space-picker.rb"
width = "60%"
height = "60%"

# fzf agent picker. prefix+a mirrors prefix+s: s for spaces, a for agents.
# Wider than the space picker because rows carry the agent's task title.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "/Users/wusher/mine/dot_files/herdr/plugins/agent-picker.rb"
width = "80%"
height = "60%"

[ui]
# New tab opens straight away, no name prompt (tmux bind n behavior)
prompt_new_tab_name = false
# Panes share one divider line instead of sitting in their own boxes.
pane_gaps = false

# Borders on. herdr 0.8.0 has no way to keep inner dividers while
# dropping the outer edge; pane_borders is one switch for both.
pane_borders = true

agent_panel_sort = "spaces"
[theme]
name = "gruvbox"
auto_switch = false
