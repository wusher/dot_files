# Nerd Font status bar (monokai)
set -g @status_bg '#272822'
set -g @status_fg '#f8f8f2'
set -g status-style 'bg=#{@status_bg},fg=#{@status_fg}'
set -g status-left-length 40
set -g status-right-length 140
set -g window-status-separator ''
set -g status-left '#($HOME/bin/tmux-mode-pill.sh "#{client_key_table}" "#{client_prefix}" "#{pane_mode}" "#{window_zoomed_flag}")'
set -g status-right '#($HOME/bin/tmux-right-status.py "#{pane_current_path}")'
set -g window-status-format '#[fg=#{@status_bg},bg=#75715e]#[fg=#f8f8f2,bg=#75715e]#($HOME/bin/tmux-workstate.py "#{pane_current_path}" "#f8f8f2" "#{window_activity_flag}" "#{window_bell_flag}") #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#75715e,bg=#{@status_bg}]'
set -g window-status-current-format '#[fg=#{@status_bg},bg=#a6e22e,bold]#[fg=#272822,bg=#a6e22e,bold] #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#a6e22e,bg=#{@status_bg},nobold]'
set -g window-status-activity-style 'fg=#e6db74,bold'
set -g window-status-bell-style 'fg=#f92672,bold'
set -g message-style 'bg=#66d9ef,fg=#272822,bold'
set -g message-command-style 'bg=#e6db74,fg=#272822,bold'
set -g pane-border-style 'fg=#75715e,bg=#161711'
set -g pane-active-border-style 'fg=#a6e22e,bg=#272822'
set -g window-style 'fg=#f8f8f2,bg=#161711'
set -g window-active-style 'fg=#f8f8f2,bg=#272822'
