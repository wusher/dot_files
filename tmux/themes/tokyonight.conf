# Nerd Font status bar (tokyonight)
set -g @status_bg '#1f2335'
set -g @status_fg '#a9b1d6'
set -g status-style 'bg=#{@status_bg},fg=#{@status_fg}'
set -g status-left-length 40
set -g status-right-length 180
set -g window-status-separator ' '
set -g status-left '#($HOME/bin/tmux/tmux-mode-pill.sh "#{client_key_table}" "#{client_prefix}" "#{pane_mode}" "#{window_zoomed_flag}") '
set -g status-right "#($HOME/bin/tmux/tmux-right-status.py '#{pane_current_path}') #($HOME/bin/quiet status | cut -d' ' -f1)"
set -g window-status-format '#[fg=#414868,bg=#{@status_bg}]#[fg=#a9b1d6,bg=#414868]#($HOME/bin/tmux/tmux-workstate.py "#{pane_current_path}" "#a9b1d6" "#{window_activity_flag}" "#{window_bell_flag}") #[fg=#ffffff,bg=#414868]#I #[fg=#a9b1d6,bg=#414868]#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//; s/^WEB-[0-9]+-?//" | cut -c1-15)#[fg=#414868,bg=#{@status_bg}]'
set -g window-status-current-format '#[fg=#7aa2f7,bg=#{@status_bg},bold]#[fg=#1f2335,bg=#7aa2f7,bold]#($HOME/bin/tmux/tmux-workstate.py "#{pane_current_path}" "#1f2335" "0" "0" " ") #[fg=#ffffff,bg=#7aa2f7,bold]#I #[fg=#1f2335,bg=#7aa2f7,bold]#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//; s/^WEB-[0-9]+-?//" | cut -c1-15)#[fg=#7aa2f7,bg=#{@status_bg},nobold]'
set -g window-status-activity-style 'fg=#e0af68,bold'
set -g window-status-bell-style 'fg=#f7768e,bold'
set -g message-style 'bg=#7aa2f7,fg=#1f2335,bold'
set -g message-command-style 'bg=#e0af68,fg=#1f2335,bold'
set -g pane-border-style 'fg=#414868,bg=#10121a'
set -g pane-active-border-style 'fg=#c0caf5,bg=#1f2335'
set -g window-style 'fg=#c0caf5,bg=#10121a'
set -g window-active-style 'fg=#c0caf5,bg=#1f2335'
