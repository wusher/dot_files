# Nerd Font status bar (tokyonight)
set -g @status_bg '#1f2335'
set -g @status_fg '#a9b1d6'
set -g status-style 'bg=#{@status_bg},fg=#{@status_fg}'
set -g status-left-length 40
set -g status-right-length 140
set -g window-status-separator ''
set -g status-left '#($HOME/bin/tmux-mode-pill.sh "#{client_key_table}" "#{client_prefix}" "#{pane_mode}" "#{window_zoomed_flag}")'
set -g status-right '#($HOME/bin/tmux-right-status.py "#{pane_current_path}")'
set -g window-status-format '#[fg=#{@status_bg},bg=#414868]#[fg=#a9b1d6,bg=#414868]#($HOME/bin/tmux-workstate.py "#{pane_current_path}" "#a9b1d6" "#{window_activity_flag}" "#{window_bell_flag}") #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#414868,bg=#{@status_bg}]'
set -g window-status-current-format '#[fg=#{@status_bg},bg=#7aa2f7,bold]#[fg=#1f2335,bg=#7aa2f7,bold] #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#7aa2f7,bg=#{@status_bg},nobold]'
set -g window-status-activity-style 'fg=#e0af68,bold'
set -g window-status-bell-style 'fg=#f7768e,bold'
set -g message-style 'bg=#7aa2f7,fg=#1f2335,bold'
set -g message-command-style 'bg=#e0af68,fg=#1f2335,bold'
set -g pane-border-style 'fg=#414868,bg=#10121a'
set -g pane-active-border-style 'fg=#c0caf5,bg=#1f2335'
set -g window-style 'fg=#c0caf5,bg=#10121a'
set -g window-active-style 'fg=#c0caf5,bg=#1f2335'
