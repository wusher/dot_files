# Nerd Font status bar (github-light)
set -g @status_bg '#f6f8fa'
set -g @status_fg '#24292f'
set -g status-style 'bg=#{@status_bg},fg=#{@status_fg}'
set -g status-left-length 40
set -g status-right-length 140
set -g window-status-separator ''
set -g status-left '#($HOME/bin/tmux-mode-pill.sh "#{client_key_table}" "#{client_prefix}" "#{pane_mode}" "#{window_zoomed_flag}")'
set -g status-right '#($HOME/bin/tmux-right-status.py "#{pane_current_path}")'
set -g window-status-format '#[fg=#{@status_bg},bg=#d0d7de]#[fg=#57606a,bg=#d0d7de]#($HOME/bin/tmux-workstate.py "#{pane_current_path}" "#57606a" "#{window_activity_flag}" "#{window_bell_flag}") #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#d0d7de,bg=#{@status_bg}]'
set -g window-status-current-format '#[fg=#{@status_bg},bg=#0969da,bold]#[fg=#ffffff,bg=#0969da,bold] #I:#(basename "#{pane_current_path}" | sed -E "s/^fleet(io)?-//" | cut -c1-15)#[fg=#0969da,bg=#{@status_bg},nobold]'
set -g window-status-activity-style 'fg=#9a6700,bold'
set -g window-status-bell-style 'fg=#cf222e,bold'
set -g message-style 'bg=#0969da,fg=#ffffff,bold'
set -g message-command-style 'bg=#2da44e,fg=#ffffff,bold'
set -g pane-border-style 'fg=#d0d7de,bg=#e7ebef'
set -g pane-active-border-style 'fg=#0969da,bg=#ffffff'
set -g window-style 'fg=#24292f,bg=#e7ebef'
set -g window-active-style 'fg=#24292f,bg=#ffffff'
