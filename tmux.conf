# ~/.tmux.conf - Zellij-style keybindings

# General settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g xterm-keys on
set -g escape-time 10
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g focus-events on
set -g aggressive-resize on
set -g status-interval 30
set -g status-position bottom
set -g display-panes-time 3000
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity off
set -g bell-action any

# Nerd Font status bar
set -g status-style 'bg=#1f2335,fg=#a9b1d6'
set -g status-left-length 40
set -g status-right-length 140
set -g status-left '#(/Users/wusher/bin/tmux-mode-pill.sh "#{client_key_table}" "#{client_prefix}") '
set -g window-status-format '#[fg=#414868,bg=#1f2335]#[fg=#a9b1d6,bg=#414868]#{?window_activity_flag,󰈈,#{?window_bell_flag,󰂞,}} #I:#(basename "#{pane_current_path}" | cut -c1-10)#[fg=#414868,bg=#1f2335] '
set -g window-status-current-format '#[fg=#7aa2f7,bg=#1f2335,bold]#[fg=#1f2335,bg=#7aa2f7,bold] #I:#(basename "#{pane_current_path}" | cut -c1-10)#[fg=#7aa2f7,bg=#1f2335,nobold] '
set -g window-status-activity-style 'fg=#e0af68,bold'
set -g window-status-bell-style 'fg=#f7768e,bold'
set -g message-style 'bg=#7aa2f7,fg=#1f2335,bold'
set -g message-command-style 'bg=#e0af68,fg=#1f2335,bold'

# Pane styling
set -g pane-border-style 'fg=#414868,bg=#1a1b26'
set -g pane-active-border-style 'fg=#6c7a96,bg=#1f2335'
set -g window-style 'bg=#1a1b26'
set -g window-active-style 'bg=#1f2335'

# Prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Direct navigation (no prefix) - Alt+h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Direct navigation - Alt+arrows
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Direct window navigation (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+n for new pane (vertical split)
bind -n M-n split-window -h

# Alt+f for zoom toggle
bind -n M-f resize-pane -Z

# Alt+i/o for moving windows
bind -n M-i swap-window -t -1\; select-window -t -1
bind -n M-o swap-window -t +1\; select-window -t +1

# Alt++/- for resize
bind -n M-= resize-pane -U 2
bind -n M-- resize-pane -D 2

# Prefix + pane operations
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + resize (capital letters)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Prefix + splits
bind d split-window -v -c "#{pane_current_path}"
bind r split-window -h -c "#{pane_current_path}"

# Prefix + pane/window management
bind x kill-pane
bind f resize-pane -Z
bind n new-window -c "#{pane_current_path}"
bind p display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$SHELL"
bind . if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E -w 80% -h 80% -x C -y C "tmux new-session -A -s scratch"'

# Zen mode toggle - hides status bar, borders, and zooms pane to full screen
bind z if-shell 'tmux show-options -g status | grep -q "status on"' 'set -g status off; set -g pane-border-style "fg=#1f2335"; resize-pane -Z; display "Zen mode ON"' 'set -g status on; set -g pane-border-style "fg=#414868,bg=#1a1b26"; set -g pane-active-border-style "fg=#6c7a96,bg=#1f2335"; resize-pane -Z; display "Zen mode OFF"'

# Popup command palette (searchable)
bind space display-popup -E -w 70% -h 70% -x C -y C "$HOME/bin/tmux-popup-menu.sh"

# Prefix + resize mode
bind R switch-client -T resize
bind -T resize h resize-pane -L 2 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 2 \; switch-client -T resize
bind -T resize H resize-pane -L 6 \; switch-client -T resize
bind -T resize J resize-pane -D 6 \; switch-client -T resize
bind -T resize K resize-pane -U 6 \; switch-client -T resize
bind -T resize L resize-pane -R 6 \; switch-client -T resize
bind -T resize q switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize R switch-client -T root
bind -T resize Left resize-pane -L 2 \; switch-client -T resize
bind -T resize Down resize-pane -D 2 \; switch-client -T resize
bind -T resize Up resize-pane -U 2 \; switch-client -T resize
bind -T resize Right resize-pane -R 2 \; switch-client -T resize

# Copy mode (like scroll mode)
bind [ copy-mode
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-f send-keys -X page-down
bind -T copy-mode-vi C-b send-keys -X page-up

# Auto-log all panes
set-hook -g after-new-window 'pipe-pane -o "exec cat >>$HOME/.tmux/logs/#S-#W-#P-$(date +%%Y%%m%%d-%%H%%M%%S).log"'
set-hook -g after-split-window 'pipe-pane -o "exec cat >>$HOME/.tmux/logs/#S-#W-#P-$(date +%%Y%%m%%d-%%H%%M%%S).log"'

# Reload config
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"
